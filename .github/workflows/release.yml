name: Build and release WordPress plugin

on:
  push:
    tags:
      - 'georg-kloster-orthodox-donate-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, gd
          coverage: none

      - name: Verify version, syntax and PDF smoke test
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^ \* Version: \(.*\)$/\1/p' georg-kloster-orthodox-donate/georg-kloster-orthodox-donate.php)"
          stable="$(sed -n 's/^Stable tag: \(.*\)$/\1/p' georg-kloster-orthodox-donate/readme.txt)"
          test "${TAG#georg-kloster-orthodox-donate-}" = "$version"
          test "${TAG#georg-kloster-orthodox-donate-}" = "$stable"
          mkdir -p tmp/admin-check-core
          curl --fail --location --silent --show-error https://wordpress.org/wordpress-7.1.tar.gz | tar -xz -C tmp/admin-check-core
          find georg-kloster-orthodox-donate tests -name '*.php' -print0 | xargs -0 -n1 php -l
          mkdir -p tmp/pdfs output/pdf
          php -d zend.assertions=1 -d assert.exception=1 tests/smoke.php
          php tests/notifications.php
          php tests/pdf-archive.php --render
          php tests/pdf-notes.php --render
          php -d zend.assertions=1 -d assert.exception=1 tests/api-domain.php
          php -d zend.assertions=1 -d assert.exception=1 tests/payment-binding.php
          php -d zend.assertions=1 -d assert.exception=1 tests/i18n.php

      - name: Build installation ZIP
        env:
          TAG: ${{ github.ref_name }}
        run: |
          package="$RUNNER_TEMP/georg-kloster-orthodox-donate-package"
          mkdir -p "$package/georg-kloster-orthodox-donate"
          rsync -a --exclude-from=.distignore ./ "$package/"
          version="${TAG#georg-kloster-orthodox-donate-}"
          (cd "$package" && zip -qr "$GITHUB_WORKSPACE/georg-kloster-orthodox-donate-$version.zip" georg-kloster-orthodox-donate)
          cp "georg-kloster-orthodox-donate-$version.zip" georg-kloster-orthodox-donate.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#georg-kloster-orthodox-donate-}"
          gh release create "$TAG" "georg-kloster-orthodox-donate-$version.zip" georg-kloster-orthodox-donate.zip \
            --title "Приход — записки, требы и пожертвования $TAG" \
            --generate-notes
