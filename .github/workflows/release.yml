name: Build and release WordPress plugin

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, gd
          coverage: none

      - name: Verify version, syntax and PDF smoke test
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^ \* Version: \(.*\)$/\1/p' kloster-prayer/kloster-prayer.php)"
          stable="$(sed -n 's/^Stable tag: \(.*\)$/\1/p' kloster-prayer/readme.txt)"
          test "$TAG" = "$version"
          test "$TAG" = "$stable"
          find kloster-prayer tests -name '*.php' -print0 | xargs -0 -n1 php -l
          mkdir -p tmp/pdfs output/pdf
          php -d zend.assertions=1 -d assert.exception=1 tests/smoke.php
          php tests/notifications.php
          php tests/pdf-archive.php --render
          php tests/pdf-notes.php --render
          php -d zend.assertions=1 -d assert.exception=1 tests/api-domain.php
          php -d zend.assertions=1 -d assert.exception=1 tests/payment-binding.php

      - name: Build installation ZIP
        env:
          TAG: ${{ github.ref_name }}
        run: |
          package="$RUNNER_TEMP/kloster-prayer-package"
          mkdir -p "$package/kloster-prayer"
          rsync -a --exclude-from=.distignore ./ "$package/"
          (cd "$package" && zip -qr "$GITHUB_WORKSPACE/kloster-prayer-$TAG.zip" kloster-prayer)
          cp "kloster-prayer-$TAG.zip" kloster-prayer.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "kloster-prayer-$TAG.zip" kloster-prayer.zip \
            --title "Православные молитвенные записки и пожертвования $TAG" \
            --generate-notes
