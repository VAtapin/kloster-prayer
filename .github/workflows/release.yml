name: Build and release WordPress plugin

on:
  push:
    tags:
      - 'georg-kloster-orthodox-donations-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, gd
          coverage: none

      - name: Verify version, syntax and PDF smoke test
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^ \* Version: \(.*\)$/\1/p' georg-kloster-orthodox-donations/georg-kloster-orthodox-donations.php)"
          stable="$(sed -n 's/^Stable tag: \(.*\)$/\1/p' georg-kloster-orthodox-donations/readme.txt)"
          test "${TAG#georg-kloster-orthodox-donations-}" = "$version"
          test "${TAG#georg-kloster-orthodox-donations-}" = "$stable"
          mkdir -p tmp/admin-check-core
          curl --fail --location --silent --show-error https://wordpress.org/wordpress-7.1.3.tar.gz | tar -xz -C tmp/admin-check-core
          find georg-kloster-orthodox-donations tests -name '*.php' -print0 | xargs -0 -n1 php -l
          mkdir -p tmp/pdfs output/pdf
          php -d zend.assertions=1 -d assert.exception=1 tests/smoke.php
          php tests/notifications.php
          php -d zend.assertions=1 -d assert.exception=1 tests/donor-actions.php
          php -d zend.assertions=1 -d assert.exception=1 tests/thank-you-template.php
          python3 tests/wordpress-org-translations.py
          php tests/pdf-archive.php --render
          php tests/pdf-notes.php --render
          php -d zend.assertions=1 -d assert.exception=1 tests/api-domain.php
          php -d zend.assertions=1 -d assert.exception=1 tests/payment-binding.php
          php -d zend.assertions=1 -d assert.exception=1 tests/i18n.php

      - name: Build installation ZIP
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 tools/build-package.py
          python3 tools/check-directory-assets.py
          version="${TAG#georg-kloster-orthodox-donations-}"
          cp "output/georg-kloster-orthodox-donations-$version.zip" georg-kloster-orthodox-donations.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#georg-kloster-orthodox-donations-}"
          gh release create "$TAG" "output/georg-kloster-orthodox-donations-$version.zip" "output/georg-kloster-orthodox-donations-wordpress-org-$version.zip" "output/georg-kloster-orthodox-donations-wordpressorg-assets.zip" georg-kloster-orthodox-donations.zip \
            --title "Пожертвования $TAG" \
            --generate-notes

  deploy-wordpress-org:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: wordpress-org-georg-kloster-orthodox-donations
      cancel-in-progress: false
    steps:
      - name: Checkout the tested release
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare exact directory package and assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^georg-kloster-orthodox-donations-[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${TAG#georg-kloster-orthodox-donations-}"
          grep -Fx " * Version: $version" georg-kloster-orthodox-donations/georg-kloster-orthodox-donations.php
          grep -Fx "Stable tag: $version" georg-kloster-orthodox-donations/readme.txt
          python3 tools/build-package.py --extract-to tmp/wordpress-org-publish
          python3 tools/check-directory-assets.py
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish code, version and images to WordPress.org
        # Reviewed stable revision; keep SVN credentials scoped to this step.
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: georg-kloster-orthodox-donations
          BUILD_DIR: tmp/wordpress-org-publish/wordpress-org/georg-kloster-orthodox-donations
          ASSETS_DIR: wordpressorg-assets
